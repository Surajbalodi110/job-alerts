name: poll-jobs
on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 min; public repos = free unlimited minutes
  workflow_dispatch:
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # persist dedup DB across runs — restore latest, save a fresh copy each run
      # (a static cache key is never updated, so key each save by run)
      - uses: actions/cache/restore@v6
        with:
          path: seen.db
          key: seen-db-${{ github.run_id }}
          restore-keys: seen-db-
      # uses YOUR committed config.yaml (saved auto-alerts) — do not overwrite
      - run: python main.py --mode once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRY: in
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GREENHOUSE_BOARDS: datadog,cloudflare
          LEVER_COMPANIES: lever,paytm
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: seen.db
          key: seen-db-${{ github.run_id }}
